<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glowing aura -->
  <circle cx="256" cy="256" r="180" fill="#38BDF8" opacity="0.08" />

  <!-- Open Book / Reflow Reading glyph -->
  <g filter="url(#shadow)">
    <!-- Book Base spine -->
    <path d="M256 380 L256 160 C230 146 170 142 108 152 C98 154 90 162 90 172 L90 380 C155 370 215 374 256 394 C297 374 357 370 422 380 L422 172 C422 162 414 154 404 152 C342 142 282 146 256 160 Z" fill="url(#pageGrad)" />
    
    <!-- Spine shadow -->
    <path d="M256 160 L256 394" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

    <!-- Left page lines (Reflow text lines) -->
    <rect x="130" y="200" width="85" height="10" rx="5" fill="#0284C7" />
    <rect x="130" y="230" width="70" height="8" rx="4" fill="#64748B" />
    <rect x="130" y="254" width="80" height="8" rx="4" fill="#64748B" />
    <rect x="130" y="278" width="60" height="8" rx="4" fill="#64748B" />
    <rect x="130" y="302" width="75" height="8" rx="4" fill="#64748B" />
    <rect x="130" y="326" width="45" height="8" rx="4" fill="#38BDF8" />

    <!-- Right page lines -->
    <rect x="297" y="200" width="85" height="10" rx="5" fill="#2563EB" />
    <rect x="297" y="230" width="75" height="8" rx="4" fill="#64748B" />
    <rect x="297" y="254" width="82" height="8" rx="4" fill="#64748B" />
    <rect x="297" y="278" width="65" height="8" rx="4" fill="#64748B" />
    <rect x="297" y="302" width="80" height="8" rx="4" fill="#64748B" />
    <rect x="297" y="326" width="50" height="8" rx="4" fill="#38BDF8" />
  </g>

  <!-- Mobile phone / tablet badge on bottom right -->
  <g transform="translate(330, 290)" filter="url(#shadow)">
    <rect width="96" height="130" rx="18" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="4" />
    <!-- Screen area -->
    <rect x="8" y="14" width="80" height="102" rx="10" fill="#1E293B" />
    <!-- Dynamic Reflow mini lines on phone screen -->
    <rect x="16" y="26" width="40" height="5" rx="2.5" fill="#38BDF8" />
    <rect x="16" y="38" width="64" height="4" rx="2" fill="#E2E8F0" />
    <rect x="16" y="48" width="58" height="4" rx="2" fill="#E2E8F0" />
    <rect x="16" y="58" width="62" height="4" rx="2" fill="#E2E8F0" />
    <rect x="16" y="68" width="50" height="4" rx="2" fill="#E2E8F0" />
    <rect x="16" y="78" width="56" height="4" rx="2" fill="#E2E8F0" />
    <rect x="16" y="90" width="30" height="4" rx="2" fill="#F59E0B" />
    <!-- Home bar -->
    <rect x="36" y="120" width="24" height="3" rx="1.5" fill="#64748B" />
  </g>
</svg>
